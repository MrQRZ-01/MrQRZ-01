<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <style>
    .heading { animation: slidein 12s ease-out infinite; }
    .bio { animation: fade 12s ease-in-out infinite; }
    .pill { animation: pillpop 12s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    
    .accentbar { animation: bar 12s ease-out infinite; transform-origin: top left; }

    @keyframes slidein {
      0% { opacity: 0; transform: translateX(-12px) }
      8% { opacity: 1; transform: translateX(0) }
      90% { opacity: 1; transform: translateX(0) }
      100% { opacity: 0; transform: translateX(0) }
    }
    @keyframes fade {
      0%, 8% { opacity: 0 }
      18% { opacity: 1 }
      90% { opacity: 1 }
      100% { opacity: 0 }
    }
    @keyframes pillpop {
      0%, 14% { opacity: 0; transform: scale(0.85) }
      22% { opacity: 1; transform: scale(1) }
      90% { opacity: 1; transform: scale(1) }
      100% { opacity: 0; transform: scale(1) }
    }
    @keyframes bar {
      0% { transform: scaleY(0) }
      10% { transform: scaleY(1) }
      90% { transform: scaleY(1) }
      100% { transform: scaleY(1) }
    }
  </style>
  <defs>
    <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#0d0d10" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#card-grad)" rx="14" ry="14"/>
  <rect x="32" y="32" width="3" height="256" fill="#2fdd2c" rx="1.5" class="accentbar"/>
  <text class="heading" x="56" y="110" fill="#f7f7fb" font-family='"Inter", system-ui, sans-serif' font-size="28" font-weight="700">Hi, I&apos;m Noone, welcome to my GitHub page.</text>
  <text class="bio" x="56" y="160" fill="#b5b5c0" font-family='"Inter", system-ui, sans-serif' font-size="15" font-weight="400"><tspan x="56" dy="0">I am a Programmer. specializing in high-performance and scalable systems for</tspan><tspan x="56" dy="22">the game industry. My focus is on C++ , engine architecture and Lua scripting.</tspan><tspan x="56" dy="22">I prioritize continuous technical evolution and learning; I can quickly master</tspan><tspan x="56" dy="22">technologies I encounter, ensuring our tools and codebases are always…</tspan></text>
  
</svg>